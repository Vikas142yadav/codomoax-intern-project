<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Blog App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
</head>
<body>
<header>
    <nav class="navbar">
        <div class="logo"><i class="fa-solid fa-blog"></i>BlogApp</div>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html" class="active">Login</a></li>
            <li><a href="register.html">Register</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
        </ul>
        <div class="menu-btn" id="menuBtn"><i class="fa-solid fa-bars"></i></div>
    </nav>
</header>
<section class="form-section">
    <div class="form-container">
        <h2>Login</h2>
        <form id="loginForm">
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="Enter your email" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn full-btn">Login</button>
            <p class="bottom-text">Don't have an account? <a href="register.html">Register</a></p>
        </form>
    </div>
</section>
<footer>
    <p>© 2026 Blog Application | All Rights Reserved</p>
</footer>
<script src="script.js"></script>
</body>
</html>
